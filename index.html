        // Ninja Character
        class NinjaCharacter {
            constructor() {
                this.x = 240;
                this.y = GROUND_Y;
                this.vx = 0;
                this.vy = 0;
                this.width = 18;
                this.height = 24;
                
                this.speed = 4.2;
                this.grounded = true;
                this.doubleJumpAvailable = true;
                this.flip = false;
                
                this.isSpinning = false;
                this.spinAngle = 0;
                this.walkCycle = 0;
                this.isSlashing = false;
                this.slashTimer = 0;
                this.isShielding = false;
                this.blinkTimer = 0;
                this.isBlinking = false;
                
                this.maxHp = 100;
                this.hp = 100;
                this.isDead = false;

                this.scarf = [];
                for (let i = 0; i < 6; i++) {
                    this.scarf.push({ x: this.x, y: this.y - 14 });
                }
            }

            jump() {
                if (this.isDead) return;
                if (this.grounded) {
                    this.vy = -12.5;
                    this.grounded = false;
                    this.doubleJumpAvailable = true;
                    sounds.playJump();
                } else if (this.doubleJumpAvailable) {
                    this.vy = -11.0;
                    this.doubleJumpAvailable = false;
                    this.isSpinning = true;
                    this.spinAngle = 0;
                    sounds.playJump();
                    
                    // Cinematic Focus Trigger on dynamic flip events
                    slowMoTimer = 35;
                    targetTimeScale = 0.3;
                    targetZoom = 1.35;
                }
            }

            slash() {
                if (this.isDead || this.isShielding) return;
                if (this.slashTimer <= 0) {
                    this.isSlashing = true;
                    this.slashTimer = 12;
                    sounds.playSlash();
                    
                    const attackRange = 55;
                    let targetEliminated = false;

                    enemies.forEach(enemy => {
                        if (enemy.dead) return;
                        const dist = enemy.x - this.x;
                        const isCorrectDir = this.flip ? (dist < 0) : (dist > 0);
                        if (isCorrectDir && Math.abs(dist) < attackRange && Math.abs((enemy.y) - this.y) < 32) {
                            enemy.die();
                            score += 150;
                            targetEliminated = true;
                        }
                    });

                    // Trigger close up slo-mo zoom on melee execution success
                    if (targetEliminated) {
                        slowMoTimer = 40;
                        targetTimeScale = 0.25;
                        targetZoom = 1.45;
                    }
                }
            }

            takeDamage(amt, knockbackSourceX) {
                if (this.isDead) return;
                
                const sourceIsRight = knockbackSourceX > this.x;
                const isFacingSource = (this.flip === false && sourceIsRight) || (this.flip === true && !sourceIsRight);
                
                if (this.isShielding && isFacingSource) {
                    sounds.playDeflect();
                    spawnDeflectionParticles(this.x + (this.flip ? -12 : 12), this.y - 12, this.flip ? -1 : 1);
                    return;
                }

                this.hp -= amt;
                screenShake = 15;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.isDead = true;
                    sounds.playDeathScream();
                    spawnBlastParticles(this.x, this.y - 12, 35);
                    triggerGameOver();
                } else {
                    sounds.playJump();
                }
            }

            update() {
                if (this.isDead) return;

                this.vy += 0.55;
                this.y += this.vy;

                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    this.grounded = true;
                    this.isSpinning = false;
                    this.doubleJumpAvailable = true;
                }

                let currentMaxSpeed = this.speed;
                if (this.isShielding) {
                    currentMaxSpeed *= 0.45;
                }
                this.x += this.vx * currentMaxSpeed;

                if (this.x < cameraX + 30) this.x = cameraX + 30;

                // Fire footstep sound clips synchronizing with stride peaks
                if (Math.abs(this.vx) > 0.1 && this.grounded) {
                    const prevCycle = this.walkCycle;
                    this.walkCycle += 0.22;
                    
                    if (Math.floor(this.walkCycle / Math.PI) > Math.floor(prevCycle / Math.PI)) {
                        sounds.playFootstep();
                    }
                } else {
                    this.walkCycle = 0;
                }

                this.blinkTimer++;
                if (this.isBlinking && this.blinkTimer > 10) {
                    this.isBlinking = false;
                    this.blinkTimer = 0;
                } else if (!this.isBlinking && this.blinkTimer > 180 + Math.random() * 100) {
                    this.isBlinking = true;
                    this.blinkTimer = 0;
                }

                if (this.isSpinning) {
                    this.spinAngle += 22;
                    if (this.spinAngle >= 360) {
                        this.isSpinning = false;
                        this.spinAngle = 0;
                    }
                }

                if (this.isSlashing) {
                    this.slashTimer--;
                    if (this.slashTimer <= 0) {
                        this.isSlashing = false;
                    }
                }

                const neckX = this.x - (this.flip ? -8 : 8);
                const neckY = this.y - 15;
                
                this.scarf[0].x += (neckX - this.scarf[0].x) * 0.45;
                this.scarf[0].y += (neckY - this.scarf[0].y) * 0.45;

                for (let i = 1; i < this.scarf.length; i++) {
                    const prev = this.scarf[i - 1];
                    const curr = this.scarf[i];
                    const dx = prev.x - curr.x;
                    const dy = prev.y - curr.y;
                    
                    curr.x += dx * 0.38 - (this.vx * 0.6);
                    curr.y += dy * 0.38 + 0.25;
                }
            }

            draw() {
                if (this.isDead) return;

                ctx.save();
                ctx.fillStyle = PALETTE.shadow;
                ctx.beginPath();
                ctx.ellipse(this.x, GROUND_Y + 1, 15, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.translate(this.x, this.y - 12);
                if (this.isSpinning) ctx.rotate((this.spinAngle * Math.PI) / 180);
                if (this.flip) ctx.scale(-1, 1);

                ctx.restore();
                ctx.save();
                ctx.fillStyle = PALETTE.sash;
                for (let i = 0; i < this.scarf.length; i++) {
                    const s = this.scarf[i];
                    const segmentSize = Math.max(2, 6 - i * 0.8);
                    ctx.fillRect(s.x - segmentSize / 2, s.y - segmentSize / 2, segmentSize, segmentSize);
                }
                ctx.restore();

                ctx.save();
                ctx.translate(this.x, this.y - 12);
                if (this.isSpinning) ctx.rotate((this.spinAngle * Math.PI) / 180);
                if (this.flip) ctx.scale(-1, 1);

                ctx.fillStyle = PALETTE.cowl;
                ctx.fillRect(-8, -14, 16, 14);

                ctx.fillStyle = PALETTE.cowlHighlight;
                ctx.fillRect(-4, -13, 8, 12);

                ctx.fillStyle = PALETTE.sash;
                ctx.fillRect(-8, -2, 16, 3);

                ctx.fillStyle = PALETTE.mask;
                ctx.fillRect(0, -11, 8, 5);

                ctx.fillStyle = '#000000';
                if (this.isBlinking) {
                    ctx.fillRect(2, -9, 5, 1);
                } else {
                    ctx.fillRect(2, -10, 2, 2);
                    ctx.fillRect(5, -10, 2, 2);
                }

                ctx.fillStyle = PALETTE.cowl;
                ctx.fillRect(-12, -9, 5, 3);

                ctx.fillStyle = PALETTE.cowl;
                const swing = Math.sin(this.walkCycle) * 6;
                if (!this.grounded) {
                    ctx.fillRect(-6, 0, 4, 5);
                    ctx.fillRect(2, 0, 4, 3);
                } else if (Math.abs(this.vx) > 0.1) {
                    ctx.fillRect(-5 + swing * 0.5, 0, 3, 6);
                    ctx.fillRect(2 - swing * 0.5, 0, 3, 6);
                } else {
                    ctx.fillRect(-5, 0, 3, 5);
                    ctx.fillRect(2, 0, 3, 5);
                }

                ctx.fillStyle = PALETTE.cowlHighlight;
                ctx.fillRect(4, -8, 4, 4);
                
                ctx.fillStyle = PALETTE.sword;
                if (this.isSlashing) {
                    ctx.save();
                    ctx.translate(6, -6);
                    const slashPercent = (12 - this.slashTimer) / 12;
                    ctx.rotate(slashPercent * Math.PI * 0.7);
                    ctx.fillRect(-2, -16, 3, 16);
                    ctx.restore();
                } else {
                    ctx.fillRect(5, -20, 2, 14);
                }

                ctx.restore();

                if (this.isShielding) {
                    ctx.save();
                    const sDir = this.flip ? -1 : 1;
                    const sX = this.x + sDir * 16;
                    const sY = this.y - 12;

                    ctx.fillStyle = 'rgba(28, 252, 0, 0.45)';
                    ctx.fillRect(sX - (sDir === 1 ? 0 : 4), sY - 18, 4, 34);
                    ctx.fillStyle = 'rgba(28, 252, 0, 0.2)';
                    ctx.fillRect(sX + (sDir === 1 ? 4 : -8), sY - 22, 4, 42);
                    ctx.restore();
                }

                if (this.isSlashing) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    const slashSign = this.flip ? -1 : 1;
                    ctx.beginPath();
                    ctx.arc(this.x + slashSign * 24, this.y - 10, 18, -Math.PI/3, Math.PI/3, this.flip);
                    ctx.lineTo(this.x + slashSign * 20, this.y - 10);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // Base Enemy
        class BaseEnemy {
            constructor(x, type) {
                this.x = x;
                this.y = GROUND_Y;
                this.type = type;
                this.width = 18;
                this.height = 24;
                this.dead = false;
                this.speed = 1.25;
                this.hp = 1;
                this.flip = true;
                this.walkCycle = 0;
                this.actionTimer = 60 + Math.random() * 90;
            }

            die() {
                if (this.dead) return;
                this.dead = true;
                sounds.playDeathScream();
                spawnSplatParticles(this.x, this.y - 12);
                
                corpses.push({
                    x: this.x,
                    y: GROUND_Y,
                    type: this.type,
                    flip: this.flip,
                    angle: 0,
                    targetAngle: Math.PI / 2,
                    velY: -3,
                    currentY: GROUND_Y
                });
            }

            update() {
                if (this.dead) return;

                const dx = ninja.x - this.x;
                this.flip = dx < 0;

                const range = this.type === 'grunt' ? 220 : 300;
                if (Math.abs(dx) > range) {
                    this.x += (dx > 0 ? 1 : -1) * this.speed;
                    this.walkCycle += 0.15;
                } else if (Math.abs(dx) < range - 50) {
                    this.x += (dx > 0 ? -1 : 1) * this.speed;
                    this.walkCycle += 0.15;
                }

                if (this.x < cameraX - 100) this.dead = true;

                this.actionTimer--;
                if (this.actionTimer <= 0) {
                    if (this.type === 'grunt') {
                        sounds.playGunshot();
                        const bDir = this.flip ? -1 : 1;
                        bullets.push({
                            x: this.x + bDir * 12,
                            y: this.y - 14,
                            vx: bDir * 7.5,
                            damage: 15
                        });
                        this.actionTimer = 90 + Math.random() * 60;
                    } else if (this.type === 'grenadier') {
                        const bDir = this.flip ? -1 : 1;
                        bombs.push({
                            x: this.x,
                            y: this.y - 20,
                            vx: bDir * (3 + Math.random() * 2.5),
                            vy: -7 - Math.random() * 3,
                            fuse: 140,
                            bounceCount: 0
                        });
                        this.actionTimer = 150 + Math.random() * 90;
                    }
                }
            }

            draw() {
                if (this.dead) return;

                ctx.fillStyle = PALETTE.shadow;
                ctx.beginPath();
                ctx.ellipse(this.x, GROUND_Y + 1, 14, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(this.x, this.y - 12);
                if (this.flip) ctx.scale(-1, 1);

                const legSwing = Math.sin(this.walkCycle) * 5;

                if (this.type === 'grunt') {
                    ctx.fillStyle = '#1c3127';
                    ctx.fillRect(-8, -14, 16, 14);
                    ctx.fillStyle = '#2c4a3c';
                    ctx.fillRect(-4, -13, 8, 12);

                    ctx.fillStyle = PALETTE.visor;
                    ctx.fillRect(1, -11, 7, 3);

                    ctx.fillStyle = '#111827';
                    ctx.fillRect(1, -8, 11, 4);

                    ctx.fillStyle = '#111c16';
                    ctx.fillRect(-5 + legSwing * 0.5, 0, 3, 5);
                    ctx.fillRect(2 - legSwing * 0.5, 0, 3, 5);

                } else if (this.type === 'grenadier') {
                    ctx.fillStyle = '#421f52';
                    ctx.fillRect(-8, -14, 16, 14);
                    ctx.fillStyle = '#5c2d73';
                    ctx.fillRect(-4, -13, 8, 12); 

                    ctx.fillStyle = PALETTE.visor;
                    ctx.fillRect(1, -11, 7, 3);

                    ctx.fillStyle = '#0f0514';
                    ctx.fillRect(-12, -13, 5, 11);

                    ctx.fillStyle = '#210e29';
                    ctx.fillRect(-5 + legSwing * 0.5, 0, 3, 5);
                    ctx.fillRect(2 - legSwing * 0.5, 0, 3, 5);
                }

                ctx.restore();
            }
        }

        // Air Strike Jet
        class AirStrikeJet {
            constructor() {
                this.xStart = cameraX + VW + 120;
                this.x = this.xStart;
                this.y = 80;
                this.speed = -6.5; 
                this.soundTriggered = false;
                this.rocketDropped = false;
                this.angle = 0;
                this.prevX = this.x;
                this.prevY = this.y;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;
                this.x += this.speed;

                const widthSegment = VW + 240;
                const pct = (this.x - cameraX) / widthSegment;
                if (pct >= 0 && pct <= 1) {
                    this.y = 80 + Math.sin(pct * Math.PI) * 210;
                }

                this.angle = Math.atan2(this.y - this.prevY, this.x - this.prevX);

                if (!this.soundTriggered && this.x < cameraX + VW) {
                    sounds.playJet();
                    this.soundTriggered = true;
                }

                if (!this.rocketDropped && pct < 0.55 && pct > 0.45) {
                    this.rocketDropped = true;
                    sounds.playGunshot();
                    missiles.push({
                        x: this.x,
                        y: this.y + 12,
                        vx: -3.8,
                        vy: 4.5,
                        size: 14
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#2b2d3d';
                ctx.beginPath();
                ctx.moveTo(-35, 0);
                ctx.lineTo(-12, -22);
                ctx.lineTo(-15, -45);
                ctx.lineTo(25, 0);
                ctx.lineTo(-15, 45);
                ctx.lineTo(-12, 22);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#4c4e61';
                ctx.fillRect(-15, -4, 20, 8);

                ctx.fillStyle = '#ff7300';
                ctx.fillRect(-38, -6, 4, 3);
                ctx.fillRect(-38, 3, 4, 3);

                ctx.restore();
            }
        }

        // Start Game State Methods
        function initGame() {
            score = 0;
            cameraX = 0;
            screenShake = 0;
            timeScale = 1.0;
            targetTimeScale = 1.0;
            cameraZoom = 1.0;
            targetZoom = 1.0;
            slowMoTimer = 0;
            
            ninja = new NinjaCharacter();
            enemies = [];
            bullets = [];
            bombs = [];
            missiles = [];
            particles = [];
            corpses = [];
            jets = [];
            fireSpots = [];

            gameState = STATE_PLAYING;
            document.getElementById('deathOverlay').classList.add('hidden');
            document.getElementById('startOverlay').classList.add('hidden');
        }

        function showStartScreen() {
            gameState = STATE_START;
            document.getElementById('deathOverlay').classList.add('hidden');
            document.getElementById('startOverlay').classList.remove('hidden');
        }

        function triggerGameOver() {
            gameState = STATE_GAMEOVER;
            
            if (score > highScore) {
                highScore = score;
                document.getElementById('highScoreText').innerText = String(highScore).padStart(5, '0');
            }

            document.getElementById('deathOverlay').classList.remove('hidden');
            
            if (autoplayEnabled) {
                let counter = 2.0;
                const rText = document.getElementById('respawnTimerText');
                const btn = document.getElementById('restartBtn');
                
                btn.classList.add('hidden');
                rText.classList.remove('hidden');
                rText.innerHTML = `AI Auto-Respawning in <span class="text-white font-black">${counter.toFixed(1)}s</span>`;

                const interval = setInterval(() => {
                    if (gameState !== STATE_GAMEOVER || !autoplayEnabled) {
                        clearInterval(interval);
                        return;
                    }
                    counter -= 0.1;
                    if (counter <= 0) {
                        clearInterval(interval);
                        initGame();
                    } else {
                        rText.innerHTML = `AI Auto-Respawning in <span class="text-white font-black">${counter.toFixed(1)}s</span>`;
                    }
                }, 100);
            } else {
                document.getElementById('respawnTimerText').classList.add('hidden');
                document.getElementById('restartBtn').classList.remove('hidden');
            }
        }

        // Autonomous Brain Sensors
        function processAIBrain() {
            if (!autoplayEnabled || ninja.isDead) return;

            ninja.vx = 0.95;
            ninja.flip = false;
            ninja.isShielding = false;

            let nearestThreat = null;
            let minThreatDist = 99999;

            bullets.forEach(b => {
                const dx = b.x - ninja.x;
                const isHeadingTowards = (b.vx < 0 && dx > 0) || (b.vx > 0 && dx < 0);
                if (isHeadingTowards && Math.abs(dx) < minThreatDist) {
                    minThreatDist = Math.abs(dx);
                    nearestThreat = { x: b.x, y: b.y, type: 'bullet', ref: b };
                }
            });

            missiles.forEach(m => {
                const dx = m.x - ninja.x;
                if (Math.abs(dx) < minThreatDist) {
                    minThreatDist = Math.abs(dx);
                    nearestThreat = { x: m.x, y: m.y, type: 'missile', ref: m };
                }
            });

            bombs.forEach(b => {
                const dx = b.x - ninja.x;
                if (Math.abs(dx) < minThreatDist) {
                    minThreatDist = Math.abs(dx);
                    nearestThreat = { x: b.x, y: b.y, type: 'bomb', ref: b };
                }
            });

            fireSpots.forEach(f => {
                const dx = f.x - ninja.x;
                if (Math.abs(dx) < 60 && Math.abs(dx) < minThreatDist) {
                    minThreatDist = Math.abs(dx);
                    nearestThreat = { x: f.x, y: GROUND_Y, type: 'fire', ref: f };
                }
            });

            const threatZone = 190;
            if (nearestThreat && minThreatDist < threatZone) {
                const facingLeft = nearestThreat.x < ninja.x;
                ninja.flip = facingLeft;
                ninja.vx = facingLeft ? -0.4 : 0.4;
                ninja.isShielding = true;
                
                if ((nearestThreat.type === 'bomb' || nearestThreat.type === 'fire') && minThreatDist < 60 && ninja.grounded) {
                    ninja.jump();
                }
                return;
            }

            let targetEnemy = null;
            let minEnemyDist = 99999;

            enemies.forEach(e => {
                if (e.dead) return;
                const dist = Math.abs(e.x - ninja.x);
                if (dist < minEnemyDist) {
                    minEnemyDist = dist;
                    targetEnemy = e;
                }
            });

            if (targetEnemy) {
                const edx = targetEnemy.x - ninja.x;
                ninja.flip = edx < 0;
                
                if (Math.abs(edx) > 35) {
                    ninja.vx = edx > 0 ? 1.0 : -1.0;
                }

                if (Math.abs(edx) < 120 && Math.abs(edx) > 40 && ninja.grounded) {
                    ninja.jump();
                }

                if (Math.abs(edx) < 48 && Math.abs(targetEnemy.y - ninja.y) < 20) {
                    ninja.slash();
                }
            }
        }

        // Physics frame engine
        function updatePhysics() {
            globalTime++;

            if (gameState === STATE_START) {
                cameraX += 0.45;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                });
                particles = particles.filter(p => p.life > 0);
                return;
            }

            if (!ninja.isDead) {
                const targetCamera = ninja.x - 220;
                cameraX += (targetCamera - cameraX) * 0.1;
                if (cameraX < 0) cameraX = 0;
            }

            if (screenShake > 0) screenShake -= 0.8;

            processAIBrain();

            if (!autoplayEnabled && !ninja.isDead) {
                ninja.vx = 0;
                if (keys.Left) {
                    ninja.vx = -1.0;
                    ninja.flip = true;
                }
                if (keys.Right) {
                    ninja.vx = 1.0;
                    ninja.flip = false;
                }
                ninja.isShielding = keys.Shield;
            }

            ninja.update();

            // Cinematic Zoom-In, Zoom-Out, Slo-Mo Timing checks
            if (slowMoTimer > 0) {
                slowMoTimer--;
                if (slowMoTimer <= 0) {
                    targetTimeScale = 1.0;
                    targetZoom = 1.0;
                }
            } else {
                if (globalTime % 480 === 0) {
                    if (Math.random() < 0.45) {
                        targetZoom = 1.28;
                        slowMoTimer = 110;
                        targetTimeScale = 0.45;
                    } else if (Math.random() < 0.3) {
                        targetZoom = 0.82;
                        slowMoTimer = 130;
                        targetTimeScale = 1.0;
                    } else {
                        targetZoom = 1.0;
                    }
                }
            }

            timeScale += (targetTimeScale - timeScale) * 0.12;
            cameraZoom += (targetZoom - cameraZoom) * 0.08;

            if (gameState === STATE_PLAYING && globalTime % 140 === 0) {
                const activeCount = enemies.filter(e => !e.dead).length;
                if (activeCount < 4) {
                    const spawnX = Math.max(cameraX + VW + 50, ninja.x + 450 + Math.random() * 200);
                    const spawnType = Math.random() > 0.4 ? 'grunt' : 'grenadier';
                    enemies.push(new BaseEnemy(spawnX, spawnType));
                }
            }

            if (gameState === STATE_PLAYING && globalTime % 360 === 0) {
                jets.push(new AirStrikeJet());
            }

            jets.forEach(j => j.update());
            jets = jets.filter(j => j.x > cameraX - 150);

            // Update persistent fire spots
            fireSpots.forEach(f => {
                f.update();
                if (!ninja.isDead && Math.abs(ninja.x - f.x) < 40 && Math.abs(ninja.y - GROUND_Y) < 30) {
                    ninja.takeDamage(1.5, f.x);
                }
                enemies.forEach(e => {
                    if (!e.dead && Math.abs(e.x - f.x) < 40) {
                        e.die();
                        score += 200;
                    }
                });
            });
            fireSpots = fireSpots.filter(f => f.life > 0);

            enemies.forEach(enemy => {
                enemy.update();
                
                if (!enemy.dead && !ninja.isDead && ninja.vy > 0.5) {
                    if (Math.abs(ninja.x - enemy.x) < 22 && 
                        (ninja.y + 12) >= (enemy.y - 18) && 
                        (ninja.y - 12) <= (enemy.y)) {
                        
                        enemy.die();
                        ninja.vy = -7.5;
                        ninja.doubleJumpAvailable = true;
                        score += 250;

                        slowMoTimer = 35;
                        targetTimeScale = 0.28;
                        targetZoom = 1.4;
                    }
                }
            });
            enemies = enemies.filter(enemy => !enemy.dead || (enemy.dead && globalTime % 10 !== 0));

            corpses.forEach(c => {
                if (c.angle < c.targetAngle) {
                    c.angle += 0.16;
                }
                c.velY += 0.4;
                c.currentY += c.velY;
                if (c.currentY >= GROUND_Y) {
                    c.currentY = GROUND_Y;
                    c.velY = 0;
                }
            });

            bullets.forEach(b => {
                b.x += b.vx;

                if (!ninja.isDead && Math.abs(b.x - ninja.x) < 12 && b.y > ninja.y - 24 && b.y < ninja.y) {
                    b.destroyed = true;
                    ninja.takeDamage(b.damage, b.x);
                }

                if (b.x < cameraX - 50 || b.x > cameraX + VW + 50) {
                    b.destroyed = true;
                }
            });
            bullets = bullets.filter(b => !b.destroyed);

            bombs.forEach(b => {
                b.vy += 0.45;
                b.x += b.vx;
                b.y += b.vy;

                if (b.y >= GROUND_Y) {
                    b.y = GROUND_Y;
                    b.vy = -b.vy * 0.55;
                    b.vx *= 0.75;
                    b.bounceCount++;
                    sounds.playJump();
                }

                b.fuse--;

                if (b.fuse <= 0) {
                    b.detonated = true;
                    sounds.playExplosion();
                    screenShake = 18;
                    spawnBlastParticles(b.x, b.y - 4, 30);
                    
                    const blastRadius = 95;
                    if (!ninja.isDead) {
                        const dist = Math.abs(ninja.x - b.x);
                        if (dist < blastRadius && Math.abs(ninja.y - b.y) < 45) {
                            ninja.takeDamage(35, b.x);
                        }
                    }
                }
            });
            bombs = bombs.filter(b => !b.detonated);

            missiles.forEach(m => {
                m.x += m.vx;
                m.y += m.vy;

                if (globalTime % 2 === 0) {
                    particles.push({
                        x: m.x,
                        y: m.y,
                        vx: -m.vx * 0.3,
                        vy: -0.5,
                        size: 3 + Math.random() * 3,
                        color: '#ff7300',
                        life: 10 + Math.random() * 10,
                        maxLife: 20,
                        type: 'block'
                    });
                }

                if (m.y >= GROUND_Y) {
                    m.destroyed = true;
                    sounds.playMissileExplosion();
                    screenShake = 24;
                    spawnHugeMissileExplosion(m.x, GROUND_Y);
                    
                    fireSpots.push(new FireSpot(m.x, GROUND_Y));

                    const blastRadius = 110;
                    if (!ninja.isDead) {
                        const dist = Math.abs(ninja.x - m.x);
                        if (dist < blastRadius && Math.abs(ninja.y - GROUND_Y) < 55) {
                            ninja.takeDamage(45, m.x);
                        }
                    }
                }
            });
            missiles = missiles.filter(m => !m.destroyed);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);

            if (gameState === STATE_PLAYING) {
                if (globalTime % 12 === 0) score += 2;
                document.getElementById('scoreText').innerText = String(score).padStart(5, '0');
            }
        }

        // Drawing and rendering layers
        function drawScene() {
            ctx.clearRect(0, 0, VW, VH);
            ctx.save();
            
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake;
                const shakeY = (Math.random() - 0.5) * screenShake;
                ctx.translate(shakeX, shakeY);
            }

            // Centering zoom scaling on ninja positions
            if (ninja && gameState !== STATE_START) {
                const ninjaScreenX = ninja.x - cameraX;
                const ninjaScreenY = ninja.y - 12;

                ctx.translate(ninjaScreenX, ninjaScreenY);
                ctx.scale(cameraZoom, cameraZoom);
                ctx.translate(-ninjaScreenX, -ninjaScreenY);
            }

            const phase = (globalTime % CYCLE_DURATION) / CYCLE_DURATION;
            
            let dayness = 0.0;
            if (phase >= 0.2 && phase < 0.35) {
                dayness = (phase - 0.2) / 0.15;
            } else if (phase >= 0.35 && phase <= 0.65) {
                dayness = 1.0;
            } else if (phase > 0.65 && phase <= 0.8) {
                dayness = 1.0 - (phase - 0.65) / 0.15;
            }

            const currentSky = getSkyColor(phase);
            const currentMountainsFar = lerpColor(PALETTE.mountainsFar, '#734c38', dayness);
            const currentMountainsMid = lerpColor(PALETTE.mountainsMid, '#8c5c44', dayness);
            const currentMountainsNear = lerpColor(PALETTE.mountainsNear, '#a67053', dayness);
            const currentCanopy = lerpColor(PALETTE.canopy, '#23613c', dayness);
            const currentTrunk = lerpColor(PALETTE.trunk, '#4a2c16', dayness);
            const currentTrunkRim = lerpColor(PALETTE.trunkRim, '#eef5b3', dayness);
            const currentDirt = lerpColor(PALETTE.dirt, '#4f3b2f', dayness);
            const currentGrassRim = lerpColor(PALETTE.grassRim, '#39e022', dayness);
            
            let starOpacity = 1.0;
            if (phase >= 0.2 && phase < 0.3) {
                starOpacity = 1.0 - (phase - 0.2) / 0.1;
            } else if (phase >= 0.3 && phase <= 0.7) {
                starOpacity = 0.0;
            } else if (phase > 0.7 && phase <= 0.8) {
                starOpacity = (phase - 0.7) / 0.1;
            }

            ctx.fillStyle = currentSky;
            ctx.fillRect(-200, -200, VW + 400, VH + 400);

            // Orbits Setup
            let moonActive = false;
            let moonX = 0, moonY = 0;
            if (phase > 0.7) {
                moonActive = true;
                const mPct = (phase - 0.7) / 0.6; 
                const mAngle = Math.PI - mPct * Math.PI;
                moonX = VW / 2 + Math.cos(mAngle) * 380;
                moonY = GROUND_Y - Math.sin(mAngle) * 260;
            } else if (phase < 0.3) {
                moonActive = true;
                const mPct = (phase + 0.3) / 0.6; 
                const mAngle = Math.PI - mPct * Math.PI;
                moonX = VW / 2 + Math.cos(mAngle) * 380;
                moonY = GROUND_Y - Math.sin(mAngle) * 260;
            }

            if (moonActive) {
                const currentMoonFaceLight = lerpColor(PALETTE.moonFaceLight, '#ffffff', dayness);
                const currentMoonFaceDark = lerpColor(PALETTE.moonFaceDark, '#cccccc', dayness);
                const mR = 60;
                
                ctx.fillStyle = currentMoonFaceLight;
                ctx.beginPath();
                ctx.arc(moonX, moonY, mR, Math.PI * 0.5, Math.PI * 1.5, false);
                ctx.fill();

                ctx.fillStyle = currentMoonFaceDark;
                ctx.beginPath();
                ctx.arc(moonX, moonY, mR, Math.PI * 1.5, Math.PI * 0.5, false);
                ctx.fill();

                ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
                ctx.beginPath(); ctx.arc(moonX - 22, moonY - 14, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(moonX + 18, moonY + 22, 13, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(moonX - 10, moonY + 28, 7, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(moonX + 24, moonY - 16, 9, 0, Math.PI*2); ctx.fill();
            }

            let sunActive = false;
            let sunX = 0, sunY = 0;
            if (phase >= 0.2 && phase <= 0.8) {
                sunActive = true;
                const sPct = (phase - 0.2) / 0.6;
                const sAngle = Math.PI - sPct * Math.PI;
                sunX = VW / 2 + Math.cos(sAngle) * 380;
                sunY = GROUND_Y - Math.sin(sAngle) * 260;
            }

            if (sunActive) {
                ctx.fillStyle = 'rgba(255, 230, 120, 0.25)';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 82, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff9d4';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 48, Math.PI * 0.5, Math.PI * 1.5, false);
                ctx.fill();

                ctx.fillStyle = '#ffdf6d';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 48, Math.PI * 1.5, Math.PI * 0.5, false);
                ctx.fill();
            }

            if (starOpacity > 0.01) {
                stars.forEach(s => {
                    const pX = (s.x - cameraX * 0.05) % VW;
                    const finalX = pX < 0 ? pX + VW : pX;
                    const bright = 0.3 + Math.abs(Math.sin(globalTime * 0.012 + s.offset)) * 0.7;
                    ctx.fillStyle = `rgba(255, 255, 255, ${bright * starOpacity})`;
                    ctx.fillRect(finalX, s.y, s.size, s.size);
                });
            }

            ctx.fillStyle = currentMountainsFar;
            backMountains.forEach(m => {
                const pX = (m.x - cameraX * 0.08) % (VW + 300);
                const finalX = pX < -200 ? pX + (VW + 300) : pX;
                ctx.beginPath();
                ctx.moveTo(finalX - m.w / 2, VH);
                ctx.lineTo(finalX, VH - m.h);
                ctx.lineTo(finalX + m.w / 2, VH);
                ctx.closePath();
                ctx.fill();
            });

            ctx.fillStyle = currentMountainsMid;
            midMountains.forEach(m => {
                const pX = (m.x - cameraX * 0.14) % (VW + 250);
                const finalX = pX < -180 ? pX + (VW + 250) : pX;
                ctx.beginPath();
                ctx.moveTo(finalX - m.w / 2, VH);
                ctx.lineTo(finalX, VH - m.h);
                ctx.lineTo(finalX + m.w / 2, VH);
                ctx.closePath();
                ctx.fill();
            });

            ctx.fillStyle = currentMountainsNear;
            frontMountains.forEach(m => {
                const pX = (m.x - cameraX * 0.22) % (VW + 200);
                const finalX = pX < -150 ? pX + (VW + 200) : pX;
                ctx.beginPath();
                ctx.moveTo(finalX - m.w / 2, VH);
                ctx.lineTo(finalX, VH - m.h);
                ctx.lineTo(finalX + m.w / 2, VH);
                ctx.closePath();
                ctx.fill();
            });

            midgroundForest.forEach(tree => {
                const pX = (tree.x - cameraX * 0.35) % (VW + 150);
                const finalX = pX < -150 ? pX + (VW + 150) : pX;

                ctx.fillStyle = currentCanopy;
                ctx.beginPath();
                ctx.arc(finalX, tree.height, tree.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = currentTrunkRim;
                ctx.beginPath();
                ctx.arc(finalX - 3, tree.height, tree.radius - 1, Math.PI * 0.6, Math.PI * 1.4);
                ctx.lineTo(finalX, tree.height);
                ctx.closePath();
                ctx.fill();
            });

            ctx.fillStyle = currentCanopy;
            ctx.fillRect(-200, GROUND_Y - 40, VW + 400, VH - GROUND_Y + 40);

            lushTrunks.forEach(trunk => {
                const pX = (trunk.x - cameraX * 0.65) % (VW + 200);
                const finalX = pX < -200 ? pX + (VW + 200) : pX;

                ctx.fillStyle = currentTrunk;
                ctx.fillRect(finalX, 0, trunk.width, GROUND_Y);

                ctx.fillStyle = currentTrunkRim;
                ctx.fillRect(finalX, 0, 3, GROUND_Y);

                ctx.fillStyle = PALETTE.vine;
                const vX = finalX + trunk.width / 2;
                ctx.fillRect(vX, 0, 4, trunk.vineLength);
                ctx.fillStyle = currentGrassRim;
                ctx.fillRect(vX, trunk.vineLength, 4, 6);
            });

            const fogOffset = (globalTime * 0.45) % VW;
            const canopyRgbStr = currentCanopy.replace('rgb(', '').replace(')', '');
            ctx.fillStyle = `rgba(${canopyRgbStr}, 0.25)`;
            ctx.fillRect(-200, 290, VW + 400, 25);
            ctx.fillRect(VW - ((fogOffset + 400) % VW), 330, 310, 30);

            if (starOpacity > 0.01) {
                fireflies.forEach(ff => {
                    const pX = (ff.x - cameraX * 0.8) % VW;
                    const finalX = pX < 0 ? pX + VW : pX;
                    const bobY = ff.y + Math.sin(globalTime * ff.speed + ff.offset) * ff.range;
                    
                    ctx.fillStyle = `rgba(28, 252, 0, ${0.4 * starOpacity})`;
                    ctx.fillRect(finalX - 3, bobY - 3, 7, 7);
                    ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                    ctx.fillRect(finalX - 1, bobY - 1, 3, 3);
                });
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            if (gameState !== STATE_START) {
                fireSpots.forEach(f => f.draw());

                corpses.forEach(c => {
                    ctx.save();
                    ctx.fillStyle = PALETTE.shadow;
                    ctx.beginPath();
                    ctx.ellipse(c.x, GROUND_Y + 1, 16, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.translate(c.x, c.currentY - 6);
                    ctx.rotate(c.angle);
                    if (c.flip) ctx.scale(-1, 1);

                    ctx.fillStyle = c.type === 'grunt' ? '#1c3127' : '#421f52';
                    ctx.fillRect(-12, -4, 24, 10);
                    ctx.fillStyle = PALETTE.visor;
                    ctx.fillRect(4, -3, 3, 6);
                    ctx.restore();
                });

                jets.forEach(jet => jet.draw());
                enemies.forEach(enemy => enemy.draw());
                
                if (ninja) ninja.draw();

                bullets.forEach(b => {
                    ctx.fillStyle = 'rgba(255, 115, 0, 0.45)';
                    ctx.fillRect(b.x - 7, b.y - 4, 14, 8);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(b.x - 4, b.y - 2, 8, 4);
                });

                bombs.forEach(b => {
                    ctx.fillStyle = PALETTE.shadow;
                    ctx.beginPath();
                    ctx.ellipse(b.x, GROUND_Y + 1, 8, 2, 0, 0, Math.PI*2);
                    ctx.fill();

                    let bombColor = '#111827';
                    if (b.fuse < 35) {
                        bombColor = Math.floor(globalTime / 4) % 2 === 0 ? '#ff003c' : '#ffffff';
                    } else if (b.fuse < 75) {
                        bombColor = Math.floor(globalTime / 9) % 2 === 0 ? '#ff7300' : '#111827';
                    }

                    ctx.fillStyle = bombColor;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y - 5, 7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fdbf15';
                    ctx.fillRect(b.x + (globalTime % 3 === 0 ? 3 : 1), b.y - 14, 2, 3);
                });

                missiles.forEach(m => {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.rotate(Math.atan2(m.vy, m.vx));
                    
                    ctx.fillStyle = PALETTE.missile;
                    ctx.fillRect(-8, -4, 16, 8);
                    ctx.fillStyle = '#fdbf15';
                    ctx.fillRect(8, -2, 4, 4);
                    ctx.restore();
                });
            }

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });

            ctx.restore();

            ctx.fillStyle = currentDirt;
            ctx.fillRect(-200, GROUND_Y, VW + 400, VH - GROUND_Y + 200);

            ctx.fillStyle = currentGrassRim;
            ctx.fillRect(-200, GROUND_Y, VW + 400, 4);

            foregroundTrees.forEach(t => {
                const pX = (t.x - cameraX * 1.35) % (VW + 300);
                const finalX = pX < -150 ? pX + (VW + 300) : pX;

                ctx.fillStyle = '#080503';
                ctx.fillRect(finalX, 0, t.width, VH);

                t.branches.forEach(b => {
                    ctx.save();
                    const startX = b.side === 1 ? finalX + t.width : finalX;
                    ctx.translate(startX, b.y);
                    ctx.rotate(b.side * b.angle);

                    ctx.fillRect(0, -b.thickness / 2, b.length * b.side, b.thickness);

                    ctx.save();
                    ctx.translate((b.length * 0.55) * b.side, 0);
                    ctx.rotate(b.side * -0.5);
                    ctx.fillRect(0, -b.thickness * 0.25, (b.length * 0.4) * b.side, b.thickness * 0.5);
                    ctx.restore();

                    ctx.restore();
                });
            });

            ctx.restore();

            // Screen Health HUD - Top Center
            if (ninja && gameState !== STATE_START) {
                const hpPercent = ninja.hp / ninja.maxHp;
                const barWidth = 180;
                const barX = (VW - barWidth) / 2;
                
                ctx.fillStyle = 'rgba(10, 14, 34, 0.8)';
                ctx.fillRect(barX, 12, barWidth, 18);
                ctx.strokeStyle = 'rgba(0, 255, 213, 0.4)';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, 12, barWidth, 18);
                
                ctx.fillStyle = currentGrassRim;
                ctx.fillRect(barX + 2, 14, (barWidth - 4) * hpPercent, 14);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(`HP: ${Math.round(ninja.hp)}%`, VW / 2, 28);
                ctx.textAlign = 'left';
            }
        }

        // Gameloop frame controller
        let lastTime = 0;
        const targetFPS = 60;
        const physicsStep = 1000 / targetFPS;
        let accumulator = 0;

        function mainLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let elapsed = timestamp - lastTime;
            lastTime = timestamp;

            if (elapsed > 200) elapsed = 200;

            accumulator += elapsed * timeScale;

            while (accumulator >= physicsStep) {
                updatePhysics();
                accumulator -= physicsStep;
            }

            drawScene();
            requestAnimationFrame(mainLoop);
        }

        // Responsive Resizing Canvas Matrix Scaling (Edge-To-Edge Fullscreen Centering)
        function scaleAndPositionCanvas() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const gameViewport = document.getElementById('game-viewport');
            
            let canvasWidth = viewportWidth;
            let canvasHeight = viewportWidth * (9 / 16);
            
            if (canvasHeight > viewportHeight) {
                canvasHeight = viewportHeight;
                canvasWidth = viewportHeight * (16 / 9);
            }
            
            // Set internal canvas drawing surface
            canvasElement.width = VW;
            canvasElement.height = VH;
            
            // Set CSS display dimensions
            canvasElement.style.width = `${canvasWidth}px`;
            canvasElement.style.height = `${canvasHeight}px`;
            canvasElement.style.position = 'absolute';
            canvasElement.style.left = `${(viewportWidth - canvasWidth) / 2}px`;
            canvasElement.style.top = `${(viewportHeight - canvasHeight) / 2}px`;
            canvasElement.style.imageRendering = 'crisp-edges';
            canvasElement.style.display = 'block';
        }

        window.addEventListener('resize', scaleAndPositionCanvas);

        // Keyboard Actions
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (gameState === STATE_START) return;
            if (key === 'a' || e.key === 'ArrowLeft') keys.Left = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.Right = true;
            if (key === 'w' || e.key === 'ArrowUp' || e.key === ' ') {
                keys.Up = true;
                if (!autoplayEnabled) ninja.jump();
            }
            if (key === 's' || e.key === 'ArrowDown') keys.Down = true;
            if (key === 'j') {
                keys.Slash = true;
                if (!autoplayEnabled) ninja.slash();
            }
            if (key === 'k') {
                keys.Shield = true;
            }
        });

        window.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.key === 'ArrowLeft') keys.Left = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.Right = false;
            if (key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.Up = false;
            if (key === 's' || e.key === 'ArrowDown') keys.Down = false;
            if (key === 'j') keys.Slash = false;
            if (key === 'k') keys.Shield = false;
        });

        canvasElement.addEventListener('mousedown', e => {
            if (gameState === STATE_START || autoplayEnabled || ninja.isDead) return;
            e.preventDefault();
            if (e.button === 0) {
                ninja.slash();
            } else if (e.button === 2) {
                keys.Shield = true;
            }
        });

        canvasElement.addEventListener('mouseup', e => {
            if (gameState === STATE_START || autoplayEnabled) return;
            if (e.button === 2) {
                keys.Shield = false;
            }
        });

        canvasElement.addEventListener('contextmenu', e => e.preventDefault());

        const aiToggleBtn = document.getElementById('aiToggleBtn');
        const startOverlay = document.getElementById('startOverlay');

        // Robust start button actions with AudioContext permissions shielding
        document.getElementById('startAiBtn').addEventListener('click', () => {
            try {
                sounds.init();
                autoplayEnabled = true;
                aiToggleBtn.innerText = "🤖 AUTO ON";
                aiToggleBtn.className = "cyber-button px-3 py-1 rounded-lg font-black tracking-wider text-xs bg-gradient-to-r from-cyan-500 to-teal-500 shadow-[0_0_12px_rgba(0,255,213,0.3)]";
                initGame();
                // Request fullscreen on mobile
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log('Fullscreen request failed:', err));
                }
            } catch(e) { console.error('Start AI error:', e); }
        });

        document.getElementById('startManualBtn').addEventListener('click', () => {
            try {
                sounds.init();
                autoplayEnabled = false;
                aiToggleBtn.innerText = "👤 MANUAL";
                aiToggleBtn.className = "cyber-button px-3 py-1 rounded-lg font-black tracking-wider text-xs bg-gradient-to-r from-amber-500 to-orange-500 shadow-[0_0_12px_rgba(245,158,11,0.3)]";
                initGame();
            } catch(e) { console.error('Start Manual error:', e); }
        });

        aiToggleBtn.addEventListener('click', () => {
            try {
                sounds.init();
                if (gameState !== STATE_PLAYING) return;
                autoplayEnabled = !autoplayEnabled;
                if (autoplayEnabled) {
                    aiToggleBtn.innerText = "🤖 AUTO ON";
                    aiToggleBtn.className = "cyber-button px-3 py-1 rounded-lg font-black tracking-wider text-xs bg-gradient-to-r from-cyan-500 to-teal-500 shadow-[0_0_12px_rgba(0,255,213,0.3)]";
                } else {
                    aiToggleBtn.innerText = "👤 MANUAL";
                    aiToggleBtn.className = "cyber-button px-3 py-1 rounded-lg font-black tracking-wider text-xs bg-gradient-to-r from-amber-500 to-orange-500 shadow-[0_0_12px_rgba(245,158,11,0.3)]";
                }
            } catch(e) { console.error('AI toggle error:', e); }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            try {
                initGame();
            } catch(e) { console.error('Restart error:', e); }
        });

        /* Mobile buttons control maps */
        const touchMappings = [
            { id: 'btnLeft', key: 'Left' },
            { id: 'btnRight', key: 'Right' },
            { id: 'btnShield', key: 'Shield' }
        ];

        touchMappings.forEach(mapping => {
            const el = document.getElementById(mapping.id);
            el.addEventListener('touchstart', e => {
                e.preventDefault();
                sounds.init();
                keys[mapping.key] = true;
            }, { passive: false });
            el.addEventListener('touchend', e => {
                e.preventDefault();
                keys[mapping.key] = false;
            }, { passive: false });
        });

        document.getElementById('btnJump').addEventListener('touchstart', e => {
            e.preventDefault();
            sounds.init();
            if (!autoplayEnabled) ninja.jump();
        }, { passive: false });

        document.getElementById('btnSlash').addEventListener('touchstart', e => {
            e.preventDefault();
            sounds.init();
            if (!autoplayEnabled) ninja.slash();
        }, { passive: false });

        // PWA install actions
        let deferredPrompt;
        const installPwaBtn = document.getElementById('installPwaBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('[PWA] Install prompt triggered');
            e.preventDefault();
            deferredPrompt = e;
            installPwaBtn.classList.remove('hidden');
        });

        // Fallback: Show install button if service worker registers (for localhost/dev)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then((reg) => {
                console.log('[PWA] Service Worker registered:', reg.scope);
                // On localhost/dev, show install button even without beforeinstallprompt
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    installPwaBtn.classList.remove('hidden');
                }
            }).catch((err) => {
                console.warn('[PWA] Service Worker registration failed:', err);
            });
        }

        installPwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                try {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`[PWA] User response: ${outcome}`);
                    deferredPrompt = null;
                    installPwaBtn.classList.add('hidden');
                } catch(e) {
                    console.error('[PWA] Install error:', e);
                }
            } else {
                alert('PWA install not available. Access via HTTP/HTTPS and ensure service worker is registered.');
            }
        });

        // Check if already installed
        const checkInstalled = () => {
            if (window.navigator.standalone === true) {
                installPwaBtn.classList.add('hidden');
                console.log('[PWA] Running as standalone app');
            }
            if (window.matchMedia('(display-mode: standalone)').matches) {
                installPwaBtn.classList.add('hidden');
                console.log('[PWA] Display mode is standalone');
            }
        };
        checkInstalled();
        
        // Listen for display-mode changes
        if (window.matchMedia) {
            window.matchMedia('(display-mode: standalone)').addListener((e) => {
                if (e.matches) {
                    installPwaBtn.classList.add('hidden');
                }
            });
        }
                    .then((reg) => console.log('Service Worker Registered Successfully', reg.scope))
                    .catch((err) => console.warn('Offline features require placing sw.js in root directory.', err));
            }
        } catch(e) {
            console.warn("Service worker registration ignored:", e);
        }

        // Direct-boot sequence on window load
        window.onload = function() {
            scaleAndPositionCanvas();
            showStartScreen();
            requestAnimationFrame(mainLoop);
        };
    </script>
</body>
</html>

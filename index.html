<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060a1d">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Midnight Shadow Autoplay Ninja</title>
    <!-- Tailwind CSS for high-end procedural styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- iOS Immersive Fullscreen Standalone App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shadow Ninja">
    <meta name="apple-touch-fullscreen" content="yes">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/060a1d/00ffd5?text=Ninja">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #03050d;
            font-family: 'Rajdhani', sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: max(0px, env(safe-area-inset-top)) 
                     max(0px, env(safe-area-inset-right)) 
                     max(0px, env(safe-area-inset-bottom)) 
                     max(0px, env(safe-area-inset-left));
        }

        .title-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Accents */
        .glass-panel {
            background: rgba(10, 14, 34, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 255, 213, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 255, 213, 0.05);
        }

        .cyber-button {
            position: relative;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .cyber-button:active {
            transform: scale(0.95);
        }

        #game-viewport {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Viewport block that acts as our canvas bounds -->
    <div id="game-viewport" class="bg-[#060a1d]">
        
        <!-- Render Layer Game Engine Canvas -->
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- Dynamic Game HUD overlay inside canvas window bounds -->
        <div id="game-hud" class="absolute top-0 inset-x-0 p-3 flex items-center justify-between pointer-events-none z-10">
            <div class="flex items-center gap-2 pointer-events-auto">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#00ffd5]"></div>
                <h1 class="title-font font-black text-sm md:text-lg tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-amber-300">
                    MIDNIGHT SHADOW
                </h1>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <button id="aiToggleBtn" class="cyber-button px-3 py-1 rounded-lg font-black tracking-wider text-xs bg-gradient-to-r from-cyan-500 to-teal-500 shadow-[0_0_12px_rgba(0,255,213,0.3)]">
                    🤖 AUTO ON
                </button>
                <!-- HUD Scores -->
                <div class="glass-panel px-3 py-1 rounded-lg text-xs font-bold flex gap-4">
                    <div>SCORE: <span id="scoreText" class="text-cyan-400 title-font">00000</span></div>
                    <div class="hidden sm:block">HI: <span id="highScoreText" class="text-amber-400 title-font">00000</span></div>
                </div>
            </div>
        </div>

        <!-- Mobile Interactive Overlay panel -->
        <div id="mobile-gamepad" class="absolute inset-x-0 bottom-0 p-8 flex justify-between items-end pointer-events-none z-20">
            <!-- D-Pad Panel -->
            <div class="flex gap-3 pointer-events-auto">
                <button id="btnLeft" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-900/60 border border-cyan-500/30 text-cyan-400 flex items-center justify-center active:bg-cyan-500/40">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                </button>
                <button id="btnRight" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-900/60 border border-cyan-500/30 text-cyan-400 flex items-center justify-center active:bg-cyan-500/40">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                </button>
            </div>

            <!-- Action Button Clusters -->
            <div class="flex gap-2.5 pointer-events-auto">
                <button id="btnShield" class="w-13 h-13 md:w-15 md:h-15 rounded-full bg-teal-950/60 border border-teal-500/30 text-teal-400 flex flex-col items-center justify-center active:bg-teal-500/40">
                    <span class="text-[9px] font-bold uppercase leading-none">Guard</span>
                    <svg class="w-5 h-5 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.9L10 1.154l7.834 3.746a1 1 0 01.564.896v5.208a11.963 11.963 0 01-2.927 7.519M10 5.5v5.757m0 0L8.5 10.243M10 11.257l1.5-1.5M10 11.257V16.5" clip-rule="evenodd" /></svg>
                </button>
                <button id="btnSlash" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-red-950/60 border border-red-500/30 text-red-400 flex flex-col items-center justify-center active:bg-red-500/40">
                    <span class="text-[9px] font-bold uppercase leading-none">Slash</span>
                    <svg class="w-6 h-6 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 00.914 10.914m0 0l5.657-5.657m-5.657 5.657l5.657 5.657" /></svg>
                </button>
                <button id="btnJump" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-amber-950/60 border border-amber-500/30 text-amber-400 flex flex-col items-center justify-center active:bg-amber-500/40">
                    <span class="text-[9px] font-bold uppercase leading-none">Jump</span>
                    <svg class="w-6 h-6 mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </div>

        <!-- Start Page Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 z-30 transition-opacity duration-300">
            <div class="text-center max-w-lg">
                <h1 class="title-font font-black text-3xl md:text-5xl tracking-[0.2em] bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-teal-300 to-amber-300 drop-shadow-[0_0_15px_rgba(0,255,213,0.3)]">
                    MIDNIGHT SHADOW
                </h1>
                <p class="text-[10px] tracking-[0.4em] uppercase text-cyan-500 font-bold mb-6">Autonomous AI Ninja Platformer</p>
                
                <!-- Action Controls Section -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center mb-6">
                    <button id="startAiBtn" class="cyber-button px-6 py-3 rounded-xl font-black tracking-widest text-xs bg-gradient-to-r from-cyan-500 to-teal-500 text-white shadow-[0_0_20px_rgba(0,255,213,0.4)]">
                        🤖 AUTOPLAY MODE
                    </button>
                    <button id="startManualBtn" class="cyber-button px-6 py-3 rounded-xl font-black tracking-widest text-xs bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-[0_0_20px_rgba(255,183,77,0.4)]">
                        👤 WARRIOR MODE
                    </button>
                </div>

                <!-- PWA Auxiliary Options Section -->
                <div class="flex flex-wrap justify-center gap-2 mb-6">
                    <button id="installPwaBtn" class="cyber-button hidden px-4 py-1.5 rounded-lg border border-cyan-400 bg-cyan-950/50 text-cyan-400 text-xs font-black tracking-wider shadow-[0_0_12px_rgba(0,255,213,0.2)]">
                        📥 INSTALL APP
                    </button>
                </div>

                <!-- Mini Rules Card Deck -->
                <div class="grid grid-cols-3 gap-2 text-left">
                    <div class="bg-cyan-950/40 border border-cyan-500/10 rounded-lg p-2">
                        <h4 class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-0.5">⚔️ Slash</h4>
                        <p class="text-[9px] text-slate-300 leading-tight">Slices grunts. (J / Tap Slash)</p>
                    </div>
                    <div class="bg-cyan-950/40 border border-cyan-500/10 rounded-lg p-2">
                        <h4 class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-0.5">🛡️ Shield</h4>
                        <p class="text-[9px] text-slate-300 leading-tight">Blocks missiles/bombs. (K / Tap Guard)</p>
                    </div>
                    <div class="bg-cyan-950/40 border border-cyan-500/10 rounded-lg p-2">
                        <h4 class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-0.5">👣 Stomp</h4>
                        <p class="text-[9px] text-slate-300 leading-tight">Land on heads to crush & double jump!</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="deathOverlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center gap-3 hidden z-20 transition-opacity duration-300">
            <h2 class="title-font text-3xl md:text-5xl font-black tracking-widest text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                NINJA SLAIN
            </h2>
            <p id="respawnTimerText" class="text-sm md:text-base font-bold tracking-wider text-teal-300">
                AI Auto-Respawning in <span class="text-white font-black">2.0s</span>
            </p>
            <button id="restartBtn" class="cyber-button px-6 py-2.5 rounded-lg bg-gradient-to-r from-red-600 to-amber-600 font-bold tracking-wider hover:brightness-110 hidden">
                RESPAWN WARRIOR
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasElement = canvas;

        /* ------------------------------------------------------------------
         * AUDIO MANAGEMENT (PROCEDURAL KAI'S INTERPOLATING THEME)
         * ------------------------------------------------------------------ */
        class RetroSoundManager {
            constructor() {
                this.ctx = null;
                this.noiseBuffer = null;
                this.musicMasterGain = null;
                this.musicInterval = null;
                this.musicStep = 0;
                this.distortionNode = null;
                
                // Orchestral scale mappings
                this.notes = {
                    'A': { bass: 55.0, mid: 110.0, lead: 220.0, brass: 440.0 },
                    'C': { bass: 65.4, mid: 130.8, lead: 261.6, brass: 523.3 },
                    'D': { bass: 73.4, mid: 146.8, lead: 293.7, brass: 587.3 },
                    'E': { bass: 82.4, mid: 164.8, lead: 329.6, brass: 659.3 },
                    'G': { bass: 98.0, mid: 196.0, lead: 392.0, brass: 784.0 }
                };
            }

            init() {
                try {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                        this.musicMasterGain = this.ctx.createGain();
                        this.musicMasterGain.gain.setValueAtTime(0.08, this.ctx.currentTime); // low bg volume
                        this.musicMasterGain.connect(this.ctx.destination);
                        this.startSequencer();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(e => console.warn("AudioContext resume rejected:", e));
                    }
                } catch (e) {
                    console.warn("Web Audio API not allowed or supported on this browser:", e);
                    this.ctx = null;
                }
            }

            createNoiseBuffer() {
                if (!this.ctx) return null;
                const bufferSize = this.ctx.sampleRate * 2.0;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2.0 - 1.0;
                }
                return buffer;
            }

            startSequencer() {
                if (this.musicInterval) return;
                this.musicInterval = setInterval(() => {
                    if (gameState === STATE_GAMEOVER) return;
                    this.tickSequencer();
                }, 160); // Driving tempo step
            }

            tickSequencer() {
                const step = this.musicStep;
                // Hans Zimmer's Arranged Motif (descending pentatonic structure)
                const riff = [
                    'A', null, 'A', null, 'C', null, 'D', null,
                    'D', null, 'C', null, 'A', null, 'A', null,
                    'A', null, 'A', null, 'C', null, 'D', null,
                    'D', null, 'C', null, 'D', null, 'E', null
                ];
                const currentNote = riff[step];

                // Taiko bass kicks
                if (step % 4 === 0) this.playHeavyDrum();
                // Backbeat metal clangs
                if (step % 8 === 4) this.playSnares();

                if (currentNote) {
                    const freqs = this.notes[currentNote];
                    this.playDistortedBass(freqs.bass);
                    this.playChorusBrass(freqs.mid, freqs.lead);
                }

                this.musicStep = (this.musicStep + 1) % 32;
            }

            playHeavyDrum() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.musicMasterGain);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playSnares() {
                if (!this.ctx) return;
                if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = this.noiseBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(950, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                noiseNode.connect(filter);
                filter.connect(gain);
                gain.connect(this.musicMasterGain);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);

                const clang = this.ctx.createOscillator();
                const clangGain = this.ctx.createGain();
                clang.connect(clangGain);
                clangGain.connect(this.musicMasterGain);

                clang.type = 'triangle';
                clang.frequency.setValueAtTime(780, this.ctx.currentTime);
                clangGain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                clangGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

                noiseNode.start();
                clang.start();
                noiseNode.stop(this.ctx.currentTime + 0.25);
                clang.stop(this.ctx.currentTime + 0.25);
            }

            playDistortedBass(freq) {
                if (!this.ctx) return;
                if (!this.distortionNode) {
                    this.distortionNode = this.ctx.createWaveShaper();
                    this.distortionNode.curve = this.makeDistortionCurve(70);
                    this.distortionNode.oversample = '4x';
                    this.distortionNode.connect(this.musicMasterGain);
                }

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.distortionNode);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.42, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.23);
            }

            playChorusBrass(freq1, freq2) {
                if (!this.ctx) return;

                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(260, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(2200, this.ctx.currentTime + 0.08);
                filter.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.25);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.musicMasterGain);

                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(freq1, this.ctx.currentTime);
                
                osc2.type = 'sawtooth';
                osc2.frequency.setValueAtTime(freq2 + 3.5, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);

                osc1.start();
                osc2.start();
                osc1.stop(this.ctx.currentTime + 0.25);
                osc2.stop(this.ctx.currentTime + 0.25);
            }

            makeDistortionCurve(amount) {
                const k = typeof amount === 'number' ? amount : 50;
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = (i * 2) / n_samples - 1;
                    curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            playFootstep() {
                try {
                    this.init();
                    if (!this.ctx) return;

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(65, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.06);

                    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.06);
                } catch(e) {}
            }

            playJump() {
                try {
                    this.init();
                    if (!this.ctx) return;

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.16);

                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.16);
                } catch(e) {}
            }

            playSlash() {
                try {
                    this.init();
                    if (!this.ctx) return;

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.22);

                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.22);
                } catch(e) {}
            }

            playDeflect() {
                try {
                    this.init();
                    if (!this.ctx) return;

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(1900, this.ctx.currentTime + 0.04);

                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.14);
                } catch(e) {}
            }

            playGunshot() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                    const noiseNode = this.ctx.createBufferSource();
                    noiseNode.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1100, this.ctx.currentTime);

                    const noiseGain = this.ctx.createGain();
                    noiseNode.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    noiseGain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                    noiseNode.start();
                    noiseNode.stop(this.ctx.currentTime + 0.12);

                    const osc = this.ctx.createOscillator();
                    const popGain = this.ctx.createGain();
                    osc.connect(popGain);
                    popGain.connect(this.ctx.destination);

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.09);

                    popGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    popGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch(e) {}
            }

            // Upgraded High Volume, Deep Echo tactical missile explosion node
            playMissileExplosion() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                    // High master volume saturation
                    const masterGain = this.ctx.createGain();
                    masterGain.gain.setValueAtTime(3.3, this.ctx.currentTime);
                    masterGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 3.8);
                    masterGain.connect(this.ctx.destination);

                    // Deep triangle rumble
                    const boomOsc = this.ctx.createOscillator();
                    const boomGain = this.ctx.createGain();
                    boomOsc.type = 'triangle';
                    boomOsc.frequency.setValueAtTime(80, this.ctx.currentTime);
                    boomOsc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 1.2);
                    
                    boomGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                    boomGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.2);
                    
                    boomOsc.connect(boomGain);
                    boomGain.connect(masterGain);
                    boomOsc.start();
                    boomOsc.stop(this.ctx.currentTime + 1.25);

                    // Lowpass filter trail
                    const noiseSource = this.ctx.createBufferSource();
                    noiseSource.buffer = this.noiseBuffer;
                    const noiseFilter = this.ctx.createBiquadFilter();
                    noiseFilter.type = 'lowpass';
                    noiseFilter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    noiseFilter.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 2.5);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2.5);

                    noiseSource.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(masterGain);
                    noiseSource.start();
                    noiseSource.stop(this.ctx.currentTime + 2.6);

                    // Swept Sawtooth acoustic resonance tail
                    const echoOsc = this.ctx.createOscillator();
                    const echoGain = this.ctx.createGain();
                    echoOsc.type = 'sawtooth';
                    echoOsc.frequency.setValueAtTime(130, this.ctx.currentTime);
                    echoOsc.frequency.linearRampToValueAtTime(55, this.ctx.currentTime + 3.5);

                    const echoFilter = this.ctx.createBiquadFilter();
                    echoFilter.type = 'bandpass';
                    echoFilter.frequency.setValueAtTime(240, this.ctx.currentTime);
                    echoFilter.Q.setValueAtTime(8.0, this.ctx.currentTime);

                    echoGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                    echoGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 3.5);

                    echoOsc.connect(echoFilter);
                    echoFilter.connect(echoGain);
                    echoGain.connect(masterGain);

                    echoOsc.start();
                    echoOsc.stop(this.ctx.currentTime + 3.6);
                } catch(e) {}
            }

            playExplosion() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                    const noiseNode = this.ctx.createBufferSource();
                    noiseNode.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(900, this.ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.75);

                    const gain = this.ctx.createGain();
                    noiseNode.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    gain.gain.setValueAtTime(0.75, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.75);

                    noiseNode.start();
                    noiseNode.stop(this.ctx.currentTime + 0.75);

                    const sub = this.ctx.createOscillator();
                    const subGain = this.ctx.createGain();
                    sub.connect(subGain);
                    subGain.connect(this.ctx.destination);

                    sub.type = 'triangle';
                    sub.frequency.setValueAtTime(90, this.ctx.currentTime);
                    sub.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.55);

                    subGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                    subGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.55);

                    sub.start();
                    sub.stop(this.ctx.currentTime + 0.55);
                } catch(e) {}
            }

            playJet() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                    const noiseNode = this.ctx.createBufferSource();
                    noiseNode.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.setValueAtTime(4.0, this.ctx.currentTime);
                    filter.frequency.setValueAtTime(180, this.ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.6);
                    filter.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 1.5);

                    const gain = this.ctx.createGain();
                    noiseNode.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.14, this.ctx.currentTime + 0.6);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);

                    noiseNode.start();
                    noiseNode.stop(this.ctx.currentTime + 1.5);
                } catch(e) {}
            }

            playDeathScream() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (!this.noiseBuffer) this.noiseBuffer = this.createNoiseBuffer();

                    const osc = this.ctx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(290, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.6);

                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.setValueAtTime(14, this.ctx.currentTime);
                    lfoGain.gain.setValueAtTime(12, this.ctx.currentTime);
                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);

                    const formantFilter = this.ctx.createBiquadFilter();
                    formantFilter.type = 'bandpass';
                    formantFilter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    formantFilter.Q.setValueAtTime(5.5, this.ctx.currentTime);

                    const mainGain = this.ctx.createGain();
                    mainGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    mainGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);

                    osc.connect(formantFilter);
                    formantFilter.connect(mainGain);
                    mainGain.connect(this.ctx.destination);

                    lfo.start();
                    osc.start();
                    lfo.stop(this.ctx.currentTime + 0.6);
                    osc.stop(this.ctx.currentTime + 0.6);

                    const noiseNode = this.ctx.createBufferSource();
                    noiseNode.buffer = this.noiseBuffer;
                    const noiseFilter = this.ctx.createBiquadFilter();
                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.setValueAtTime(950, this.ctx.currentTime);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.09, this.ctx.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);

                    noiseNode.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    noiseNode.start();
                    noiseNode.stop(this.ctx.currentTime + 0.6);
                } catch(e) {}
            }
        }

        const sounds = new RetroSoundManager();

        const GROUND_Y = 415;

        // Color Interpolation Module
        function lerpColor(c1, c2, factor) {
            const parseHex = (hex) => {
                let r = parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(5, 7), 16);
                return { r, g, b };
            };
            const rgb1 = parseHex(c1);
            const rgb2 = parseHex(c2);
            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * factor);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * factor);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * factor);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function getSkyColor(phase) {
            if (phase < 0.2) return '#1a0e2e';
            if (phase < 0.27) {
                const f = (phase - 0.2) / 0.07;
                return lerpColor('#1a0e2e', '#b5336d', f);
            }
            if (phase < 0.35) {
                const f = (phase - 0.27) / 0.08;
                return lerpColor('#b5336d', '#5793e6', f);
            }
            if (phase < 0.65) return '#5793e6';
            if (phase < 0.72) {
                const f = (phase - 0.65) / 0.07;
                return lerpColor('#5793e6', '#e36e3b', f);
            }
            if (phase < 0.8) {
                const f = (phase - 0.72) / 0.08;
                return lerpColor('#e36e3b', '#1a0e2e', f);
            }
            return '#1a0e2e';
        }
